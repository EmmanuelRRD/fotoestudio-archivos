apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: fotoestudio-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "db"
            - name: DB_NAME
              value: "fotoestudio"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "fotoestudio"
            - name: DB_PORT
              value: "3306"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:30008"
            - name: TEST_CHARSET
              value: "utf8mb4"
            - name: TEST_COLLATION
              value: "utf8mb4_unicode_ci"
            - name: TEST_NAME
              value: "fotoestudio"
          envFrom:
            - configMapRef:
                name: backend-config
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30008
  selector:
    app: backend
